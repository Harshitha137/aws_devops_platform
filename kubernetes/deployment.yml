apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-api
  namespace: employee-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-api
  template:
    metadata:
      labels:
        app: employee-api
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: employee-api
          image: 446983861261.dkr.ecr.ap-south-1.amazonaws.com/employee-api:${BUILD_NUMBER}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
            path: /
            port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livelinessProbe:
             httpGet:
             path: /
             port: http
             initialDelaySeconds: 60
             periodSeconds: 15
             timeoutSeconds: 2
             failureThreshold: 3
            
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi

  
